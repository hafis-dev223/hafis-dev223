<svg width="100%" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="60%" stop-color="#0d0426"/>
      <stop offset="100%" stop-color="#1a063a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <style>
    @keyframes titleFloat { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes glowPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
    @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(40px); } }
    @keyframes twinkle { 0%,100% { opacity: 0.9; } 50% { opacity: 0.2; } }
    @keyframes idleA { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes idleB { 0%,100% { transform: translateY(-3px); } 50% { transform: translateY(5px); } }
    @keyframes idleC { 0%,100% { transform: translateY(-5px); } 50% { transform: translateY(3px); } }
    @keyframes armWave { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(6deg); } }
    @keyframes shadowBreathe { 0%,100% { transform: scaleX(1); opacity:0.4; } 50% { transform: scaleX(0.7); opacity:0.2; } }
    @keyframes steam { 0%,100% { opacity: 0.8; transform: translateY(0px); } 50% { opacity: 0.2; transform: translateY(-6px); } }

    .pixelFont { font-family: 'Courier New', monospace; font-weight: bold; }
    .titleBlock { animation: titleFloat 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .glow { animation: glowPulse 2.4s ease-in-out infinite; }
    .grid { animation: gridMove 1.4s linear infinite; }
    .star { animation: twinkle 2.5s ease-in-out infinite; }
    .charA { animation: idleA 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    .charB { animation: idleB 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    .charC { animation: idleC 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    .armR { animation: armWave 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
    .sh { transform-box: fill-box; transform-origin: center; }
    .shA { animation: shadowBreathe 2.4s ease-in-out infinite; }
    .shB { animation: shadowBreathe 2.8s ease-in-out infinite; }
    .shC { animation: shadowBreathe 2.6s ease-in-out infinite; }
    .steamPuff { animation: steam 2s ease-in-out infinite; }
  </style>

  <rect width="900" height="400" fill="url(#bg)"/>

  <g fill="#ffffff">
    <circle class="star" cx="60" cy="40" r="1.6" style="animation-delay:.2s"/>
    <circle class="star" cx="150" cy="80" r="1.2" style="animation-delay:.9s"/>
    <circle class="star" cx="800" cy="50" r="1.6" style="animation-delay:.4s"/>
    <circle class="star" cx="720" cy="100" r="1.2" style="animation-delay:1.3s"/>
    <circle class="star" cx="850" cy="140" r="1.4" style="animation-delay:.7s"/>
    <circle class="star" cx="40" cy="150" r="1.4" style="animation-delay:1.6s"/>
    <circle class="star" cx="450" cy="30" r="1.3" style="animation-delay:1s"/>
  </g>

  <clipPath id="floorClip"><rect x="0" y="300" width="900" height="100"/></clipPath>
  <g clip-path="url(#floorClip)">
    <g class="grid" stroke="#ff2d95" stroke-width="1" opacity="0.35">
      <line x1="0" y1="300" x2="900" y2="300"/>
      <line x1="0" y1="320" x2="900" y2="320"/>
      <line x1="0" y1="340" x2="900" y2="340"/>
      <line x1="0" y1="360" x2="900" y2="360"/>
      <line x1="0" y1="380" x2="900" y2="380"/>
      <line x1="0" y1="400" x2="900" y2="400"/>
    </g>
    <g stroke="#4bf0ff" stroke-width="1" opacity="0.25">
      <line x1="90" y1="300" x2="10" y2="400"/>
      <line x1="230" y1="300" x2="150" y2="400"/>
      <line x1="370" y1="300" x2="330" y2="400"/>
      <line x1="530" y1="300" x2="570" y2="400"/>
      <line x1="670" y1="300" x2="750" y2="400"/>
      <line x1="810" y1="300" x2="890" y2="400"/>
    </g>
  </g>

  <!-- 3D pixel title HAFIS -->
  <g class="titleBlock">
    <text x="454" y="94" text-anchor="middle" class="pixelFont" font-size="58" fill="#3d0f66">HAFIS</text>
    <text x="450" y="90" text-anchor="middle" class="pixelFont" font-size="58" fill="#7c1fb8">HAFIS</text>
    <text x="446" y="86" text-anchor="middle" class="pixelFont glow" font-size="58" fill="#ff2d95">HAFIS</text>
    <text x="450" y="118" text-anchor="middle" class="pixelFont" font-size="15" fill="#4bf0ff" letter-spacing="4">SOFTWARE ENGINEER · CYBER SECURITY</text>
  </g>

  <!-- JAVA character -->
  <g transform="translate(190,150)">
    <ellipse class="sh shA" cx="0" cy="150" rx="45" ry="10" fill="#000000" filter="url(#soft)"/>
    <g class="charA">
      <rect x="8" y="10" width="4" height="4" fill="#ffd8a8" opacity="0.8" class="steamPuff"/>
      <rect x="16" y="8" width="4" height="4" fill="#ffd8a8" opacity="0.6" class="steamPuff" style="animation-delay:.4s"/>
      <rect x="-16" y="-6" width="32" height="10" rx="1" fill="#fff3e6" stroke="#5a2600" stroke-width="2"/>
      <rect x="-20" y="0" width="40" height="34" fill="#ffcf9e" stroke="#5a2600" stroke-width="2"/>
      <rect x="-12" y="10" width="6" height="6" fill="#5a2600"/>
      <rect x="6" y="10" width="6" height="6" fill="#5a2600"/>
      <rect x="-6" y="20" width="12" height="3" fill="#5a2600"/>
      <rect x="-26" y="36" width="52" height="46" fill="#ff7a30" stroke="#5a2600" stroke-width="2"/>
      <rect x="-16" y="46" width="32" height="10" fill="#fff3e6" stroke="#5a2600" stroke-width="1.5"/>
      <g class="armR">
        <rect x="-40" y="40" width="16" height="14" fill="#ff7a30" stroke="#5a2600" stroke-width="2"/>
      </g>
      <rect x="24" y="40" width="16" height="14" fill="#ff7a30" stroke="#5a2600" stroke-width="2"/>
      <rect x="-20" y="82" width="16" height="30" fill="#3d1c00" stroke="#000" stroke-width="1.5"/>
      <rect x="4" y="82" width="16" height="30" fill="#3d1c00" stroke="#000" stroke-width="1.5"/>
    </g>
  </g>
  <text x="190" y="330" text-anchor="middle" class="pixelFont" font-size="16" fill="#ff9d5c">JAVA</text>

  <!-- KOTLIN character -->
  <g transform="translate(450,150)">
    <ellipse class="sh shB" cx="0" cy="150" rx="45" ry="10" fill="#000000" filter="url(#soft)"/>
    <g class="charB">
      <rect x="-20" y="0" width="40" height="34" fill="#e8ddff" stroke="#3d1f8f" stroke-width="2"/>
      <rect x="-12" y="10" width="6" height="6" fill="#3d1f8f"/>
      <rect x="6" y="10" width="6" height="6" fill="#3d1f8f"/>
      <rect x="-6" y="20" width="12" height="3" fill="#3d1f8f"/>
      <rect x="-26" y="36" width="52" height="46" fill="#7f52ff" stroke="#3d1f8f" stroke-width="2"/>
      <path d="M -10 46 L 4 60 L -10 74 Z" fill="#f4eeff"/>
      <path d="M -10 46 L 10 46 L -10 66 Z" fill="#c9b6ff"/>
      <rect x="-40" y="40" width="16" height="14" fill="#7f52ff" stroke="#3d1f8f" stroke-width="2"/>
      <g class="armR">
        <rect x="24" y="40" width="16" height="14" fill="#7f52ff" stroke="#3d1f8f" stroke-width="2"/>
      </g>
      <rect x="-20" y="82" width="16" height="30" fill="#241056" stroke="#000" stroke-width="1.5"/>
      <rect x="4" y="82" width="16" height="30" fill="#241056" stroke="#000" stroke-width="1.5"/>
    </g>
  </g>
  <text x="450" y="330" text-anchor="middle" class="pixelFont" font-size="16" fill="#c299ff">KOTLIN</text>

  <!-- POSTGRESQL character -->
  <g transform="translate(710,150)">
    <ellipse class="sh shC" cx="0" cy="150" rx="45" ry="10" fill="#000000" filter="url(#soft)"/>
    <g class="charC">
      <rect x="16" y="4" width="10" height="8" fill="#8fb4ff" stroke="#122b6b" stroke-width="1.5"/>
      <rect x="-26" y="4" width="10" height="8" fill="#8fb4ff" stroke="#122b6b" stroke-width="1.5"/>
      <rect x="-20" y="0" width="40" height="34" fill="#cfe0ff" stroke="#122b6b" stroke-width="2"/>
      <rect x="-12" y="10" width="6" height="6" fill="#122b6b"/>
      <rect x="6" y="10" width="6" height="6" fill="#122b6b"/>
      <rect x="-4" y="20" width="8" height="6" fill="#122b6b"/>
      <rect x="-26" y="36" width="52" height="46" fill="#3567e0" stroke="#122b6b" stroke-width="2"/>
      <rect x="-16" y="46" width="32" height="10" fill="#cfe0ff" stroke="#122b6b" stroke-width="1.5"/>
      <rect x="-40" y="40" width="16" height="14" fill="#3567e0" stroke="#122b6b" stroke-width="2"/>
      <g class="armR">
        <rect x="24" y="40" width="16" height="14" fill="#3567e0" stroke="#122b6b" stroke-width="2"/>
      </g>
      <rect x="-20" y="82" width="16" height="30" fill="#0a1a40" stroke="#000" stroke-width="1.5"/>
      <rect x="4" y="82" width="16" height="30" fill="#0a1a40" stroke="#000" stroke-width="1.5"/>
    </g>
  </g>
  <text x="710" y="330" text-anchor="middle" class="pixelFont" font-size="16" fill="#8fb4ff">POSTGRESQL</text>

</svg>
