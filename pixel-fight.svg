<svg width="100%" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05010f"/>
      <stop offset="60%" stop-color="#0d0426"/>
      <stop offset="100%" stop-color="#1a063a"/>
    </linearGradient>
    <radialGradient id="javaG" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffb26b"/>
      <stop offset="55%" stop-color="#ff7a30"/>
      <stop offset="100%" stop-color="#9c3d00"/>
    </radialGradient>
    <radialGradient id="kotlinG" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c299ff"/>
      <stop offset="45%" stop-color="#7f52ff"/>
      <stop offset="100%" stop-color="#3d1f8f"/>
    </radialGradient>
    <radialGradient id="pgG" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8fb4ff"/>
      <stop offset="50%" stop-color="#3567e0"/>
      <stop offset="100%" stop-color="#122b6b"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <style>
    @keyframes floatY { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
    @keyframes floatY2 { 0%,100% { transform: translateY(-6px); } 50% { transform: translateY(10px); } }
    @keyframes floatY3 { 0%,100% { transform: translateY(-10px); } 50% { transform: translateY(6px); } }
    @keyframes spin3d { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.12); } }
    @keyframes shadowBreathe { 0%,100% { transform: scaleX(1); opacity:0.45; } 50% { transform: scaleX(0.55); opacity:0.2; } }
    @keyframes titleFloat { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes glowPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(40px); } }
    @keyframes twinkle { 0%,100% { opacity: 0.9; } 50% { opacity: 0.2; } }

    .coinWrap { transform-box: fill-box; transform-origin: center; }
    .coin1 { animation: floatY 3.2s ease-in-out infinite; }
    .coin2 { animation: floatY2 3.8s ease-in-out infinite; }
    .coin3 { animation: floatY3 3.5s ease-in-out infinite; }
    .spin1 { animation: spin3d 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spin2 { animation: spin3d 3.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spin3 { animation: spin3d 2.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sh1 { animation: shadowBreathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sh2 { animation: shadowBreathe 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sh3 { animation: shadowBreathe 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .titleBlock { animation: titleFloat 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .glow { animation: glowPulse 2.4s ease-in-out infinite; }
    .grid { animation: gridMove 1.4s linear infinite; }
    .star { animation: twinkle 2.5s ease-in-out infinite; }
    .pixelFont { font-family: 'Courier New', monospace; font-weight: bold; }
  </style>

  <rect width="900" height="400" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="star" cx="60" cy="40" r="1.6" style="animation-delay:.2s"/>
    <circle class="star" cx="150" cy="80" r="1.2" style="animation-delay:.9s"/>
    <circle class="star" cx="800" cy="50" r="1.6" style="animation-delay:.4s"/>
    <circle class="star" cx="720" cy="100" r="1.2" style="animation-delay:1.3s"/>
    <circle class="star" cx="850" cy="140" r="1.4" style="animation-delay:.7s"/>
    <circle class="star" cx="40" cy="150" r="1.4" style="animation-delay:1.6s"/>
  </g>

  <!-- perspective grid floor -->
  <g clip-path="url(#floorClip)">
    <clipPath id="floorClip"><rect x="0" y="300" width="900" height="100"/></clipPath>
    <g class="grid" stroke="#ff2d95" stroke-width="1" opacity="0.35">
      <line x1="0" y1="300" x2="900" y2="300"/>
      <line x1="0" y1="320" x2="900" y2="320"/>
      <line x1="0" y1="340" x2="900" y2="340"/>
      <line x1="0" y1="360" x2="900" y2="360"/>
      <line x1="0" y1="380" x2="900" y2="380"/>
      <line x1="0" y1="400" x2="900" y2="400"/>
    </g>
    <g stroke="#4bf0ff" stroke-width="1" opacity="0.25">
      <line x1="90" y1="300" x2="10" y2="400"/>
      <line x1="230" y1="300" x2="150" y2="400"/>
      <line x1="370" y1="300" x2="330" y2="400"/>
      <line x1="530" y1="300" x2="570" y2="400"/>
      <line x1="670" y1="300" x2="750" y2="400"/>
      <line x1="810" y1="300" x2="890" y2="400"/>
    </g>
  </g>

  <!-- 3D pixel title HAFIS -->
  <g class="titleBlock">
    <text x="454" y="94" text-anchor="middle" class="pixelFont" font-size="58" fill="#3d0f66">HAFIS</text>
    <text x="450" y="90" text-anchor="middle" class="pixelFont" font-size="58" fill="#7c1fb8">HAFIS</text>
    <text x="446" y="86" text-anchor="middle" class="pixelFont" font-size="58" fill="#ff2d95" class="glow">HAFIS</text>
    <text x="450" y="118" text-anchor="middle" class="pixelFont" font-size="15" fill="#4bf0ff" letter-spacing="4">SOFTWARE ENGINEER · CYBER SECURITY</text>
  </g>

  <!-- JAVA coin -->
  <g class="coin1 coinWrap" transform="translate(190,240)">
    <ellipse class="sh1" cx="0" cy="72" rx="55" ry="12" fill="#000000" filter="url(#soft)"/>
    <g class="spin1">
      <circle r="60" fill="url(#javaG)" stroke="#5a2600" stroke-width="3"/>
      <path d="M -14 6 q -10 12 8 18 q 22 6 34 -4 q 6 -6 -4 -10" fill="none" stroke="#5a2600" stroke-width="4" stroke-linecap="round"/>
      <path d="M -6 -6 q 14 -14 26 4" fill="none" stroke="#fff3e6" stroke-width="4" stroke-linecap="round"/>
      <path d="M 6 -14 q 14 -12 24 2" fill="none" stroke="#fff3e6" stroke-width="4" stroke-linecap="round"/>
      <rect x="-22" y="4" width="34" height="22" rx="3" fill="#fff3e6" stroke="#5a2600" stroke-width="3"/>
      <path d="M 12 8 q 16 0 16 10 q 0 10 -16 10" fill="none" stroke="#fff3e6" stroke-width="4"/>
    </g>
  </g>
  <text x="190" y="330" text-anchor="middle" class="pixelFont" font-size="16" fill="#ff9d5c">JAVA</text>

  <!-- KOTLIN coin -->
  <g class="coin2 coinWrap" transform="translate(450,230)">
    <ellipse class="sh2" cx="0" cy="82" rx="55" ry="12" fill="#000000" filter="url(#soft)"/>
    <g class="spin2">
      <circle r="60" fill="url(#kotlinG)" stroke="#25105c" stroke-width="3"/>
      <path d="M -22 -22 L 0 0 L -22 22 Z" fill="#e8ddff"/>
      <path d="M -22 -22 L 24 -22 L 0 0 Z" fill="#f4eeff"/>
      <path d="M -22 22 L 24 22 L 0 0 L 24 -22 Z" fill="#c9b6ff" opacity="0.9"/>
    </g>
  </g>
  <text x="450" y="330" text-anchor="middle" class="pixelFont" font-size="16" fill="#c299ff">KOTLIN</text>

  <!-- POSTGRESQL coin -->
  <g class="coin3 coinWrap" transform="translate(710,240)">
    <ellipse class="sh3" cx="0" cy="72" rx="55" ry="12" fill="#000000" filter="url(#soft)"/>
    <g class="spin3">
      <circle r="60" fill="url(#pgG)" stroke="#0a1a40" stroke-width="3"/>
      <ellipse cx="-6" cy="4" rx="30" ry="26" fill="#eaf1ff"/>
      <path d="M 20 -6 q 20 -4 22 14 q 1 12 -14 10 q 4 -12 -8 -24 Z" fill="#eaf1ff"/>
      <circle cx="-16" cy="-2" r="4" fill="#122b6b"/>
      <circle cx="4" cy="-2" r="4" fill="#122b6b"/>
      <path d="M -22 18 q 6 10 16 4" fill="none" stroke="#122b6b" stroke-width="3" stroke-linecap="round"/>
      <path d="M -2 20 l -4 14 M 6 20 l -2 14 M 14 18 l 0 12" stroke="#eaf1ff" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <text x="710" y="330" text-anchor="middle" class="pixelFont" font-size="16" fill="#8fb4ff">POSTGRESQL</text>

</svg>
